<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morton Industries × Hike Medical — Email Series Review</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .doc-download { text-align:center; margin-bottom: 16px; font-size:13px; }
  .doc-download a { display:inline-block; font-size:13px; font-weight:700; color:#fff; background:var(--morton-blue); padding:8px 18px; border-radius:8px; text-decoration:none; margin: 0 6px; }
  .email-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items:start; }
  .email-item { text-align:center; }
  .email-label { font-size:12px; color:var(--text-gray); margin-bottom:10px; }
  .doc-viewer-wrap { display:flex; justify-content:center; padding: 0 0 8px; }
  .doc-viewer-wrap img { width:100%; max-width:480px; height:auto; box-shadow:0 10px 40px rgba(16,24,40,0.15); background:#fff; border-radius:4px; display:block; cursor: zoom-in; margin: 0 auto; }
  .doc-hint { text-align:center; font-size:12px; color:var(--text-gray); margin: -8px 0 16px; }
  @media (max-width:800px){ .email-grid{grid-template-columns:1fr; max-width:480px; margin:0 auto;} }

  .lb-overlay { position:fixed; inset:0; background:rgba(10,14,26,0.92); z-index:1000; display:none; align-items:center; justify-content:center; overflow:auto; }
  .lb-overlay.open { display:flex; }
  .lb-overlay.open.zoomed { display:block; padding:40px; box-sizing:border-box; }
  .lb-overlay img { display:block; }
  .lb-overlay img.fit { max-width:92vw; max-height:92vh; width:auto; height:auto; cursor: zoom-in; margin:auto; }
  .lb-overlay img.full { max-width:none; max-height:none; width:auto; height:auto; cursor: grab; margin:0; -webkit-user-drag:none; user-select:none; }
  .lb-overlay img.full.dragging { cursor: grabbing; }
  .lb-close { position:fixed; top:18px; right:22px; z-index:1001; width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,0.12); color:#fff; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .lb-close:hover { background:rgba(255,255,255,0.22); }
  .lb-hint { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:1001; color:#fff; font-size:12px; opacity:.75; }
</style>
</head>
<body>

<div class="subpage-bar"><a href="index.html">← Back to Lookbook</a></div>
<div class="subpage-title">
  <span class="num">08</span>
  <h2>Morton Email Series</h2>
  <span class="desc">Email sequence introducing the benefit and how it works</span>
</div>

<div class="subpage-content">
  <div class="doc-download">
    <a href="MORTON%20EMAILS%201.png" download>Download Email 1</a>
    <a href="MORTON%20EMAILS%202.png" download>Download Email 2</a>
  </div>

  <div class="email-grid">
    <div class="email-item">
      <div class="email-label">Email 1 &middot; Welcome to Your Benefit</div>
      <div class="doc-viewer-wrap">
        <img class="email-thumb" data-full="MORTON%20EMAILS%201.png" src="MORTON%20EMAILS%201.png" alt="Morton Email 1">
      </div>
    </div>
    <div class="email-item">
      <div class="email-label">Email 2</div>
      <div class="doc-viewer-wrap">
        <img class="email-thumb" data-full="MORTON%20EMAILS%202.png" src="MORTON%20EMAILS%202.png" alt="Morton Email 2">
      </div>
    </div>
  </div>
  <div class="doc-hint">Click either email to zoom in for a closer look</div>

  <div id="comments-root" data-page="emails"></div>
</div>

<div class="lb-overlay" id="lbOverlay">
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <img id="lbImg" class="fit" src="" alt="Morton Email — zoomed">
  <div class="lb-hint">Click to zoom in/out &middot; drag to look around &middot; Esc or click outside to close</div>
</div>

<script src="js/comments-config.js"></script>
<script src="js/comments.js"></script>
<script src="js/nav.js"></script>
<script>
(function () {
  var thumbs = document.querySelectorAll('.email-thumb');
  var overlay = document.getElementById('lbOverlay');
  var lbImg = document.getElementById('lbImg');
  var closeBtn = document.getElementById('lbClose');

  function openLightbox(src) {
    lbImg.src = src;
    lbImg.className = 'fit';
    overlay.classList.remove('zoomed');
    overlay.classList.add('open');
  }
  function closeLightbox() {
    overlay.classList.remove('open');
    overlay.classList.remove('zoomed');
  }

  var isDown = false;
  var didDrag = false;
  var startX = 0, startY = 0, startScrollLeft = 0, startScrollTop = 0;

  thumbs.forEach(function (thumb) {
    thumb.addEventListener('click', function () { openLightbox(thumb.getAttribute('data-full')); });
  });
  closeBtn.addEventListener('click', closeLightbox);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeLightbox();
  });

  lbImg.addEventListener('click', function () {
    if (didDrag) { didDrag = false; return; }
    var zoomingIn = lbImg.className.indexOf('full') === -1;
    lbImg.className = zoomingIn ? 'full' : 'fit';
    overlay.classList.toggle('zoomed', zoomingIn);
    if (zoomingIn) {
      requestAnimationFrame(function () {
        overlay.scrollLeft = (overlay.scrollWidth - overlay.clientWidth) / 2;
        overlay.scrollTop = (overlay.scrollHeight - overlay.clientHeight) / 2;
      });
    }
  });

  lbImg.addEventListener('pointerdown', function (e) {
    if (lbImg.className.indexOf('full') === -1) return;
    isDown = true;
    didDrag = false;
    startX = e.clientX;
    startY = e.clientY;
    startScrollLeft = overlay.scrollLeft;
    startScrollTop = overlay.scrollTop;
    lbImg.classList.add('dragging');
    lbImg.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  lbImg.addEventListener('pointermove', function (e) {
    if (!isDown) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) didDrag = true;
    overlay.scrollLeft = startScrollLeft - dx;
    overlay.scrollTop = startScrollTop - dy;
  });
  function endDrag() {
    isDown = false;
    lbImg.classList.remove('dragging');
  }
  lbImg.addEventListener('pointerup', endDrag);
  lbImg.addEventListener('pointercancel', endDrag);

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeLightbox();
  });
})();
</script>
</body>
</html>
